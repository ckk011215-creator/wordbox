<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Sans+TC:wght@400;500;700&display=swap">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
:root{
  color-scheme: light;
  --ground:#e7eaee;
  --surface:#fcfcfb;
  --surface-2:#f2f3f0;
  --slip:#fdfdfa;
  --ink:#0b0b0b;
  --ink-2:#52514e;
  --muted:#898781;
  --line:#e1e0d9;
  --line-strong:#c3c2b7;
  --accent:#1b3a6b;
  --accent-soft:#e3ebf7;
  --accent-ink:#fcfcfb;
  --gold:#9c6a10;
  --gold-soft:#f6edd9;
  --good:#0ca30c;
  --warning:#fab219;
  --critical:#d03b3b;
  --shadow:0 1px 2px rgba(11,11,11,.06), 0 6px 18px rgba(11,11,11,.05);
  --shadow-lift:0 2px 4px rgba(11,11,11,.08), 0 14px 34px rgba(11,11,11,.10);
  --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --font-ui:"IBM Plex Sans","Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  --font-display:"Newsreader","Noto Sans TC",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0d0d0d;
    --surface:#1a1a19;
    --surface-2:#232322;
    --slip:#20201f;
    --ink:#ffffff;
    --ink-2:#c3c2b7;
    --muted:#898781;
    --line:#2c2c2a;
    --line-strong:#383835;
    --accent:#7ba3e8;
    --accent-soft:#1b2433;
    --accent-ink:#0d0d0d;
    --gold:#d9a441;
    --gold-soft:#2a2418;
    --good:#0ca30c;
    --warning:#fab219;
    --critical:#e06a6a;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.34);
    --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 16px 36px rgba(0,0,0,.45);
    --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0d0d0d;
  --surface:#1a1a19;
  --surface-2:#232322;
  --slip:#20201f;
  --ink:#ffffff;
  --ink-2:#c3c2b7;
  --muted:#898781;
  --line:#2c2c2a;
  --line-strong:#383835;
  --accent:#7ba3e8;
  --accent-soft:#1b2433;
  --accent-ink:#0d0d0d;
  --gold:#d9a441;
  --gold-soft:#2a2418;
  --good:#0ca30c;
  --warning:#fab219;
  --critical:#e06a6a;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 18px rgba(0,0,0,.34);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55), 0 16px 36px rgba(0,0,0,.45);
  --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
}

*{box-sizing:border-box}
body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.wrap{max-width:940px;margin:0 auto;padding-inline:16px}

/* ---------- header ---------- */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--surface);border-bottom:1px solid var(--line);
}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{
  font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:.06em;
  line-height:1.1;
}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.12em}
.whoami{margin-left:auto;display:flex;align-items:center;gap:9px}
.whoami .nm{font-size:13px;font-weight:500;max-width:11ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .pt{
  font-family:var(--font-mono);font-size:12px;color:var(--accent);
  background:var(--accent-soft);padding:2px 8px;border-radius:999px;
  font-variant-numeric:tabular-nums;
}
.av{
  width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:600;color:#fff;overflow:hidden;
}
.av img{width:100%;height:100%;object-fit:cover;display:block}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:0;background:transparent;padding:7px 13px;border-radius:999px;
  font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.tabs button:hover{background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

main{padding-block:22px 64px;display:grid;gap:22px;min-width:0}
main > section{min-width:0}

/* ---------- generic pieces ---------- */
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px;box-shadow:var(--shadow);min-width:0;
}
.panel-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-h h2{font-size:16px;letter-spacing:.01em}
.panel-h .note{font-size:12.5px;color:var(--muted);margin-left:auto}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-family:var(--font-mono);
}
.dim{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--muted)}

.btn{
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  padding:9px 18px;border-radius:9px;font-weight:500;font-size:14px;cursor:pointer;
  transition:transform .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;color:var(--ink-2);
}
.chip b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.on b{color:var(--accent)}
.chip.warn{background:var(--gold-soft);border-color:transparent;color:var(--gold)}
.chip.warn b{color:var(--gold)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stat{background:var(--surface);padding:13px 15px}
.stat .k{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-family:var(--font-mono)}
.stat .v{font-family:var(--font-display);font-size:27px;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-family:var(--font-ui)}

/* ---------- the box ---------- */
.boxstage{display:grid;grid-template-columns:150px 1fr;gap:26px;align-items:center}
@media (max-width:560px){.boxstage{grid-template-columns:1fr;gap:18px;text-align:center;justify-items:center}}
.boxstage svg{width:150px;height:auto;max-width:100%}
.boxstage h2{font-family:var(--font-display);font-size:23px;font-weight:500;margin-bottom:6px}

/* ---------- paper slips ---------- */
.slip{
  position:relative;background:var(--slip);border:1px solid var(--line);
  border-radius:3px 10px 10px 3px;padding:14px 16px 14px 24px;
  box-shadow:var(--shadow);
}
.slip::before{
  content:"";position:absolute;left:9px;top:9px;bottom:9px;width:1px;
  background:repeating-linear-gradient(to bottom,var(--line-strong) 0 3px,transparent 3px 7px);
}
.slip .w{font-family:var(--font-display);font-size:24px;line-height:1.2;letter-spacing:-.01em}
.slip .m{font-size:14.5px;color:var(--ink-2);margin-top:2px}
.slip .ex{font-family:var(--font-display);font-style:italic;font-size:14px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.slip .src{
  margin-top:9px;font-size:11.5px;color:var(--muted);font-family:var(--font-mono);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.slip.masked .w{color:var(--muted);letter-spacing:.14em}

.slipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}

@keyframes dealIn{from{opacity:0;transform:translateY(14px) rotate(-3deg)}to{opacity:1;transform:none}}
.deal{animation:dealIn .42s cubic-bezier(.22,.9,.3,1) both}
@media (prefers-reduced-motion:reduce){.deal{animation:none}}

/* ---------- flashcard ---------- */
.deck{display:grid;gap:14px;justify-items:center}
.card{
  width:100%;max-width:460px;min-height:244px;perspective:1200px;background:none;border:0;padding:0;cursor:pointer;
}
.card-in{
  position:relative;width:100%;min-height:244px;transition:transform .5s cubic-bezier(.3,.8,.3,1);
  transform-style:preserve-3d;
}
.card.flipped .card-in{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card-in{transition:none}}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--slip);border:1px solid var(--line);border-radius:4px 14px 14px 4px;
  box-shadow:var(--shadow-lift);display:grid;align-content:center;gap:8px;
  padding:26px 26px 32px 34px;text-align:left;overflow:hidden;
}
.face::before{
  content:"";position:absolute;left:12px;top:12px;bottom:12px;width:1px;
  background:repeating-linear-gradient(to bottom,var(--line-strong) 0 3px,transparent 3px 7px);
}
.face.back{transform:rotateY(180deg)}
.face .word{font-family:var(--font-display);font-size:38px;line-height:1.12;letter-spacing:-.015em}
.face .mean{font-size:19px;font-weight:500}
.face .exx{font-family:var(--font-display);font-style:italic;color:var(--ink-2);font-size:15px;line-height:1.55}
.face .hint{position:absolute;right:16px;bottom:12px;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.face .from{font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
.deckbar{display:flex;align-items:center;gap:12px;width:100%;max-width:460px}
.pips{display:flex;gap:5px;flex:1}
.pip{height:4px;flex:1;border-radius:2px;background:var(--line-strong)}
.pip.done{background:var(--accent)}
.pip.now{background:var(--ink)}

/* ---------- quiz ---------- */
.q{display:grid;gap:14px;max-width:560px;margin-inline:auto;width:100%}
.q .prompt{
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:18px 20px;
}
.q .prompt .big{font-family:var(--font-display);font-size:30px;line-height:1.2}
.q .prompt .big.zh{font-size:22px;font-family:var(--font-ui);font-weight:500}
.q .prompt .cloze{font-family:var(--font-display);font-style:italic;font-size:19px;line-height:1.6}
.q .prompt .cloze u{text-decoration:none;border-bottom:2px solid var(--accent);padding-inline:22px;margin-inline:3px}
.qtimer{display:flex;align-items:center;gap:10px}
.qtimer .track{flex:1;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.qtimer .fill{height:100%;width:100%;background:var(--accent);border-radius:3px;transition:width .1s linear}
.qtimer .fill.low{background:var(--warning)}
.qtimer .fill.out{background:var(--critical)}
.qtimer .sec{
  font-family:var(--font-mono);font-size:12.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;min-width:4ch;text-align:right;
}
.qtimer .sec.low{color:var(--critical)}
.pos{
  display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;
  padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);
  vertical-align:middle;
}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:10px;padding:12px 15px;cursor:pointer;font-size:15px;
  display:flex;gap:11px;align-items:center;transition:background .12s,border-color .12s;
}
.opt:hover:not([disabled]){background:var(--surface-2)}
.opt .lt{
  font-family:var(--font-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);
  width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;
}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.right .lt{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--critical);background:color-mix(in srgb,var(--critical) 10%,var(--surface))}
.opt.wrong .lt{border-color:var(--critical);color:var(--critical)}
.opt[disabled]{cursor:default}
.verdict{font-size:14px;display:flex;gap:8px;align-items:flex-start;min-height:22px}
.verdict.ok{color:var(--good)}
.verdict.no{color:var(--critical)}

/* ---------- forms ---------- */
.form{display:grid;gap:11px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
label{display:grid;gap:5px;font-size:12px;color:var(--muted);letter-spacing:.04em}
input,textarea,select{
  font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;width:100%;
}
.row3{display:grid;grid-template-columns:1fr 110px 1fr;gap:11px}
@media (max-width:560px){.row3{grid-template-columns:1fr}}
.steps{display:grid;gap:6px}
.st{
  display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;
  font-size:13px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;
}
.st .n{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.st .iv{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:12.5px}
.st.mastered{background:var(--gold-soft);border-color:transparent}
.st.mastered .n,.st.mastered .iv{color:var(--gold)}
textarea{resize:vertical;min-height:62px;font-family:var(--font-display)}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* ---------- leaderboard ---------- */
.rank{display:grid;gap:8px}
.rk{
  display:grid;grid-template-columns:26px 28px 1fr auto;gap:12px;align-items:center;
  padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  position:relative;overflow:hidden;
}
.rk.me{border-color:var(--accent);background:var(--accent-soft)}
.rk .no{font-family:var(--font-mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rk.top .no{color:var(--gold);font-weight:500}
.rk .who{min-width:0;display:grid;gap:1px}
.rk .who .n{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .who .sub{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font-mono);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .pts{font-family:var(--font-display);font-size:23px;font-variant-numeric:tabular-nums;line-height:1}
.rk .pts small{font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-left:3px}
.rk .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);opacity:.45}

/* ---------- charts ---------- */
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.lg i{width:11px;height:11px;border-radius:3px;display:block;flex:none}
.tip{
  position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:9px;padding:8px 11px;font-size:12.5px;box-shadow:var(--shadow-lift);
  min-width:118px;z-index:5;
}
.tip .d{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .r i{width:9px;height:9px;border-radius:2px;flex:none}
.tip .r b{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500}

.boxbars{display:grid;gap:7px}
.bb{display:grid;grid-template-columns:116px 1fr 34px;gap:10px;align-items:center;font-size:12.5px}
.bb .lb{color:var(--ink-2);font-size:12px}
.bb .tr{background:var(--surface-2);border-radius:4px;height:16px;overflow:hidden}
.bb .fl{display:block;height:100%;border-radius:4px;min-width:3px}
.bb .n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}

.duebars{display:flex;gap:6px;align-items:flex-end}
.db{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.db .bar{flex:none;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px}
.db .bar.zero{background:var(--line-strong)}
.db .lb{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.db .vv{font-size:11px;font-family:var(--font-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line)}
th{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-family:var(--font-mono);font-weight:400;background:var(--surface-2);position:sticky;top:0;
}
tr:last-child td{border-bottom:0}
td.wd{font-family:var(--font-display);font-size:16px}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.boxtag{
  display:inline-block;font-family:var(--font-mono);font-size:11px;padding:1px 7px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);
}
.boxtag.m{background:var(--gold-soft);border-color:transparent;color:var(--gold)}

.empty{
  text-align:center;padding:30px 18px;color:var(--muted);font-size:14px;
  border:1px dashed var(--line-strong);border-radius:12px;
}

.banner{
  display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--gold);
  background:var(--gold-soft);border-radius:10px;padding:9px 14px;
}
.banner b{font-weight:600}
</style>
<style>
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--ground);padding:24px}
.gatecard{max-width:420px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px 28px;box-shadow:var(--shadow-lift);text-align:center}
.gatemark{font-family:var(--font-display);font-size:30px;letter-spacing:.1em;margin-bottom:18px}
.gatecard h1{font-family:var(--font-display);font-size:22px;font-weight:500;margin-bottom:10px}

<script type="module">
/* ============================================================
   Word Box - self-hosted edition (Firebase backend)
   Only the two blocks below need editing. Leave everything else alone.
   ============================================================ */

/* (1) Paste the firebaseConfig Firebase gave you here (replace the whole object). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAlgaNY_sJlNvVigAZExM-XiI1KpPWh5_U",
  authDomain: "wordbox-646af.firebaseapp.com",
  projectId: "wordbox-646af",
  storageBucket: "wordbox-646af.firebasestorage.app",
  messagingSenderId: "360066952118",
  appId: "1:360066952118:web:13b8aac1ffa47608742f17"
};

/* (2) The box owner's Gmail (only they can add/remove members or open it up).
      Put the same address in the Firestore rules. Nothing else needs editing -
      members are added inside the app and take effect immediately. */
const OWNER_EMAIL = "ckk011215@gmail.com";

/* ============================================================
   Nothing below needs editing
   ============================================================ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, setDoc, deleteDoc, getDoc,
  onSnapshot, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

(function(){
"use strict";

var CONFIGURED = FIREBASE_CONFIG.apiKey.indexOf("PASTE") !== 0;
var FB = {app:null, auth:null, db:null, me:null};
var ROSTER = {emails:[], open:false};      // member list, stored in Firestore config/roster
var IS_OWNER = false;

function lc(s){ return String(s||"").trim().toLowerCase(); }
function inRoster(email){
  var e=lc(email);
  if(!e) return false;
  if(e===lc(OWNER_EMAIL)) return true;
  if(ROSTER.open===true) return true;
  return (ROSTER.emails||[]).some(function(x){ return lc(x)===e; });
}

/* ===================== constants ===================== */
var DRAW_N = 5;                 // blind-draw 5 words a day
var QUIZ_SEC = 20;              // seconds per question

/* Ebbinghaus review schedule: 8 intervals */
var MIN=60000, HR=3600000, DAY=86400000;
var STEPS = [
  {ms:5*MIN,  label:"5 min"},
  {ms:30*MIN, label:"30 min"},
  {ms:12*HR,  label:"12 hours"},
  {ms:1*DAY,  label:"1 day"},
  {ms:2*DAY,  label:"2 days"},
  {ms:4*DAY,  label:"4 days"},
  {ms:7*DAY,  label:"7 days"},
  {ms:15*DAY, label:"15 days"}
];
var GRADUATED = STEPS.length;   // stage 8 = graduated
var MASTER_STAGE = 6;           // reaching the 7-day interval counts as mastered
var PTS = { word:2, correct:10, perfect:15 };
var SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
var POS_LIST = ["n.","v.","adj.","adv.","prep.","conj.","phr."];

/* ===================== helpers ===================== */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    if(c==="&") return "&amp;";
    if(c==="<") return "&lt;";
    if(c===">") return "&gt;";
    if(c==='"') return "&quot;";
    return "&#39;";
  });
}
function dstr(d){
  var y=d.getFullYear(), m=d.getMonth()+1, dd=d.getDate();
  return y+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;
}
function today(){ return dstr(new Date()); }
function addDays(ds,n){
  var p=ds.split("-");
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()+n);
  return dstr(d);
}
function endOfToday(){
  var d=new Date(); d.setHours(23,59,59,999); return d.getTime();
}
function mdLabel(ds){ var p=ds.split("-"); return (+p[1])+"/"+(+p[2]); }
function fmtRel(due){
  var d=due-Date.now();
  if(d<=0) return "due now";
  if(d<60*MIN) return "in "+Math.max(1,Math.round(d/MIN))+" min";
  if(d<24*HR) return "in "+Math.round(d/HR)+" h";
  var dd=Math.round(d/DAY);
  return dd===1 ? "tomorrow" : "in "+dd+" days";
}
function stageLabel(b){
  if(b>=GRADUATED) return "Graduated";
  return "Stage "+(b+1);
}
function stageInterval(b){
  return b>=GRADUATED ? "15 days" : STEPS[b].label;
}
function nextDue(b){
  var i = Math.min(b, STEPS.length-1);
  return Date.now() + STEPS[i].ms;
}
function shuffle(a){
  var r=a.slice();
  for(var i=r.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function el(id){ return document.getElementById(id); }
function pct(n,d){ return d>0 ? Math.round(n/d*100) : 0; }

/* ===================== state ===================== */
var S = {
  db:null, user:null, uid:null, canWriteShared:null,
  demo:true, resolved:false,
  pool:[], prog:{}, profiles:{},
  tab:"today", session:null, flash:null
};

function blankProg(uid){ return {uid:uid, pts:0, cards:{}, days:{}}; }
function myProg(){ return S.prog[S.uid] || blankProg(S.uid); }
function progOf(uid){ return S.prog[uid] || blankProg(uid); }
function wordById(id){
  for(var i=0;i<S.pool.length;i++){ if(S.pool[i].id===id) return S.pool[i]; }
  return null;
}
function profile(uid){
  var p=S.profiles[uid];
  if(p) return p;
  return {name:"", color:"#898781", avatarUrl:""};
}
function nameOf(uid){ return profile(uid).name || "Someone"; }
function memberIds(){
  var set={}, out=[];
  Object.keys(S.prog).forEach(function(u){ set[u]=1; });
  S.pool.forEach(function(w){ if(w.by) set[w.by]=1; });
  if(S.uid) set[S.uid]=1;
  Object.keys(set).forEach(function(u){ out.push(u); });
  out.sort();
  return out;
}
function seriesVar(uid){
  var ids=memberIds();
  var i=ids.indexOf(uid);
  return "var("+SERIES[(i<0?0:i)%SERIES.length]+")";
}

/* ===================== derived metrics ===================== */
function addedToday(){
  var t=today(), n=0;
  S.pool.forEach(function(w){ if(w.by===S.uid && w.date===t) n++; });
  return n;
}
function todayEntry(uid){
  var p=progOf(uid);
  return p.days[today()] || null;
}
function dueCards(uid){
  var p=progOf(uid), now=Date.now(), out=[];
  Object.keys(p.cards).forEach(function(id){
    var c=p.cards[id];
    if(typeof c.due==="number" && c.due<=now && wordById(id)) out.push({id:id, card:c});
  });
  out.sort(function(a,b){ return a.card.due-b.card.due; });
  return out;
}
function masteredCount(p){
  var n=0;
  Object.keys(p.cards).forEach(function(id){ if((p.cards[id].b||0)>=MASTER_STAGE) n++; });
  return n;
}
function streakOf(uid){
  var p=progOf(uid), d=today(), n=0;
  if(!(p.days[d] && p.days[d].qt>0)) d=addDays(d,-1);
  while(p.days[d] && p.days[d].qt>0){ n++; d=addDays(d,-1); }
  return n;
}
function accuracyOf(p){
  var c=0,t=0;
  Object.keys(p.days).forEach(function(d){ c+=(p.days[d].qc||0); t+=(p.days[d].qt||0); });
  return {c:c,t:t,p:pct(c,t)};
}
function contributedBy(uid){
  var n=0; S.pool.forEach(function(w){ if(w.by===uid) n++; });
  return n;
}

/* ===================== persistence ===================== */
function cloneProg(p){ return JSON.parse(JSON.stringify(p)); }
function canAct(){ return S.demo || !!S.uid; }

function saveProgress(next){
  if(!canAct()) return Promise.resolve();
  next.updated = new Date().toISOString();
  if(FB.me){ next.name = FB.me.displayName || ""; next.photo = FB.me.photoURL || ""; }
  S.prog[S.uid] = next;
  if(FB.db && S.uid && !S.demo){
    return setDoc(doc(FB.db, "progress", S.uid), next).catch(function(e){
      flash("Could not save progress: "+(e && e.code ? e.code : "unknown"));
      render();
    });
  }
  return Promise.resolve();
}

function addWord(w){
  if(!canAct()){ flash("You are not signed in to this box, so it is read-only for now."); render(); return Promise.resolve(); }
  var rec = {
    word:w.word, pos:w.pos||"", meaning:w.meaning, example:w.example||"", source:w.source||"",
    by:S.uid, at:new Date().toISOString(), date:today()
  };
  if(FB.db && !S.demo){
    return addDoc(collection(FB.db, "pool"), rec).then(function(){
      var p=cloneProg(myProg()); p.pts=(p.pts||0)+PTS.word;
      return saveProgress(p);
    }).catch(function(e){
      flash("Could not add the word: "+(e && e.code ? e.code : "unknown"));
      render();
    });
  }
  rec.id = "d"+Math.random().toString(36).slice(2,9);
  S.pool.unshift(rec);
  var p=cloneProg(myProg()); p.pts=(p.pts||0)+PTS.word;
  return saveProgress(p);
}

function removeWord(id){
  if(FB.db && !S.demo) return deleteDoc(doc(FB.db, "pool", id)).catch(function(){ flash("Could not take that slip back. Try again."); });
  S.pool = S.pool.filter(function(w){ return w.id!==id; });
  render();
  return Promise.resolve();
}

function flash(msg){
  S.flash = msg;
  setTimeout(function(){ if(S.flash===msg){ S.flash=null; render(); } }, 6000);
}

/* ===================== actions ===================== */
function drawToday(){
  if(!canAct()){ flash("You are not signed in to this box, so it is read-only for now."); render(); return; }
  var p = cloneProg(myProg());
  var t = today();
  if(p.days[t] && p.days[t].d && p.days[t].d.length) return;
  var known = p.cards;
  var fresh = S.pool.filter(function(w){ return !known[w.id]; });
  var pick = shuffle(fresh).slice(0,DRAW_N);
  if(pick.length<DRAW_N){
    var rest = shuffle(S.pool.filter(function(w){
      return !pick.some(function(x){return x.id===w.id;});
    })).slice(0, DRAW_N-pick.length);
    pick = pick.concat(rest);
  }
  if(!pick.length) return;
  p.days[t] = {d:pick.map(function(w){return w.id;}), st:0, qc:0, qt:0, m:masteredCount(p), p:0};
  pick.forEach(function(w){
    if(!p.cards[w.id]) p.cards[w.id] = {b:0, due:nextDue(0), s:0, c:0, w:0};
  });
  saveProgress(p);
  S.session = null;
  render();
}

function startStudy(){
  var e = todayEntry(S.uid);
  if(!e) return;
  S.session = {mode:"study", ids:e.d.slice(), i:0, flipped:false};
  render();
}

function studyNext(){
  var s=S.session;
  if(!s || s.mode!=="study") return;
  s.i++; s.flipped=false;
  if(s.i>=s.ids.length){
    var p=cloneProg(myProg()), t=today();
    var alreadyQuizzed = !!(p.days[t] && p.days[t].qt>0);
    if(p.days[t] && !p.days[t].st){ p.days[t].st=1; saveProgress(p); }
    S.session=null;
    if(alreadyQuizzed){ render(); return; }
    startQuiz("quiz", todayEntry(S.uid).d.slice());
    return;
  }
  render();
}

function buildQuestions(ids){
  var qs=[];
  ids.forEach(function(id){
    var w=wordById(id);
    if(!w) return;
    var others=shuffle(S.pool.filter(function(x){
      return x.id!==id && x.word && x.meaning;
    })).slice(0,3);
    if(others.length<3) return;
    var kinds=["en2zh","zh2en"];
    if(w.example && w.example.toLowerCase().indexOf(String(w.word).toLowerCase().slice(0,4))>=0) kinds.push("cloze");
    var kind=kinds[Math.floor(Math.random()*kinds.length)];
    var opts;
    if(kind==="en2zh") opts=[w.meaning].concat(others.map(function(o){return o.meaning;}));
    else opts=[w.word].concat(others.map(function(o){return o.word;}));
    var order=shuffle([0,1,2,3]);
    qs.push({
      id:id, kind:kind, word:w,
      opts:order.map(function(k){return opts[k];}),
      ans:order.indexOf(0),
      picked:null, tookMs:0
    });
  });
  return qs;
}

function startQuiz(mode, ids){
  var qs=buildQuestions(ids);
  if(!qs.length){ flash("Not enough words in the box to build a quiz (4 minimum). Add a few more first."); render(); return; }
  S.session={mode:mode, qs:qs, i:0, correct:0, deadline:Date.now()+QUIZ_SEC*1000, timeouts:0};
  render();
}

function answer(k){
  var s=S.session;
  if(!s || (s.mode!=="quiz" && s.mode!=="review")) return;
  var q=s.qs[s.i];
  if(q.picked!==null) return;
  stopTimer();
  q.tookMs = QUIZ_SEC*1000 - Math.max(0, s.deadline-Date.now());
  q.picked = k;                       // -1 = timed out
  if(k===q.ans) s.correct++;
  if(k===-1) s.timeouts++;
  render();
}

function nextQuestion(){
  var s=S.session;
  s.i++;
  if(s.i<s.qs.length){
    s.deadline = Date.now()+QUIZ_SEC*1000;
    render();
    return;
  }
  finishQuiz();
}

function finishQuiz(){
  stopTimer();
  var s=S.session, p=cloneProg(myProg()), t=today();
  var gained=0, up=0, down=0;
  s.qs.forEach(function(q){
    var c=p.cards[q.id] || {b:0, due:nextDue(0), s:0, c:0, w:0};
    c.s=(c.s||0)+1;
    var ok=q.picked===q.ans;
    if(ok){
      c.c=(c.c||0)+1;
      c.b=Math.min(GRADUATED,(c.b||0)+1);
      up++;
      if(s.mode==="quiz") gained += PTS.correct;
    }else{
      c.w=(c.w||0)+1;
      c.b=Math.max(0,(c.b||0)-2);     // wrong or timed out: drop two stages
      down++;
    }
    c.due = nextDue(c.b);
    p.cards[q.id]=c;
  });
  if(s.mode==="quiz" && s.correct===s.qs.length) gained+=PTS.perfect;
  p.pts=(p.pts||0)+gained;
  if(!p.days[t]) p.days[t]={d:[], st:0, qc:0, qt:0, m:0, p:0};
  if(s.mode==="quiz"){
    p.days[t].qc=(p.days[t].qc||0)+s.correct;
    p.days[t].qt=(p.days[t].qt||0)+s.qs.length;
    p.days[t].p=(p.days[t].p||0)+gained;
  }
  p.days[t].m=masteredCount(p);
  saveProgress(p);
  S.session={mode:"result", from:s.mode, correct:s.correct, total:s.qs.length,
             gained:gained, timeouts:s.timeouts, up:up, down:down, qs:s.qs};
  render();
}

function startReview(){
  var due=dueCards(S.uid);
  if(!due.length) return;
  startQuiz("review", due.slice(0,8).map(function(d){return d.id;}));
}

/* ===================== quiz timer ===================== */
var timerId=null;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){
  stopTimer();
  var s=S.session;
  if(!s || (s.mode!=="quiz" && s.mode!=="review")) return;
  var q=s.qs[s.i];
  if(!q || q.picked!==null) return;
  var fill=el("qFill"), sec=el("qSec");
  if(!fill||!sec) return;
  var total=QUIZ_SEC*1000;
  timerId=setInterval(function(){
    var s2=S.session;
    if(!s2 || (s2.mode!=="quiz" && s2.mode!=="review")){ stopTimer(); return; }
    var left=Math.max(0, s2.deadline-Date.now());
    var f=el("qFill"), sc=el("qSec");
    if(!f||!sc){ stopTimer(); return; }
    f.style.width=(left/total*100)+"%";
    var secs=Math.ceil(left/1000);
    sc.textContent=secs+"s";
    f.className="fill"+(left<=5000?" low":"")+(left<=0?" out":"");
    sc.className="sec"+(left<=5000?" low":"");
    if(left<=0){ stopTimer(); answer(-1); }
  },100);
}

/* ===================== rendering ===================== */
function avatarHTML(uid){
  var p=profile(uid);
  var nm=p.name || "Someone";
  if(p.avatarUrl){
    return '<span class="av" style="background:'+esc(p.color)+'"><img src="'+esc(p.avatarUrl)+'" alt=""></span>';
  }
  return '<span class="av" style="background:'+esc(p.color)+'">'+esc(nm.slice(0,1))+'</span>';
}

function renderWho(){
  var p=myProg();
  el("whoami").innerHTML =
    avatarHTML(S.uid) +
    '<span class="nm">'+esc(profile(S.uid).name||"You")+'</span>' +
    '<span class="pt">'+(p.pts||0)+' pts</span>' +
    (FB.me ? '<button class="btn ghost sm" id="btnOut">Sign out</button>' : '');
  bind("btnOut", function(){ signOut(FB.auth); });
}

function renderBanner(){
  var h="";
  if(S.demo){
    h+='<div class="banner"><b>Demo mode</b><span>Not connected to a backend yet. Paste your firebaseConfig at the top of the HTML file to turn this into your shared word box.</span></div>';
  }
  if(S.flash) h+='<div class="banner" style="margin-top:8px"><span>'+esc(S.flash)+'</span></div>';
  el("banner").innerHTML=h;
}

/* ---------- today tab ---------- */
function boxSVG(){
  return '<svg viewBox="0 0 160 140" role="img" aria-label="the shared word box">'+
  '<g transform="rotate(-7 48 40)"><rect x="34" y="18" width="30" height="40" rx="2" fill="var(--slip)" stroke="var(--line-strong)"/></g>'+
  '<g transform="rotate(5 80 34)"><rect x="68" y="12" width="28" height="40" rx="2" fill="var(--slip)" stroke="var(--line-strong)"/></g>'+
  '<g transform="rotate(-2 112 40)"><rect x="98" y="20" width="28" height="38" rx="2" fill="var(--slip)" stroke="var(--line-strong)"/></g>'+
  '<path d="M14 54 L146 54 L134 130 L26 130 Z" fill="var(--accent)" opacity="0.92"/>'+
  '<path d="M14 54 L146 54 L142 70 L18 70 Z" fill="var(--ink)" opacity="0.14"/>'+
  '<rect x="52" y="57" width="56" height="7" rx="3.5" fill="var(--ground)" opacity="0.85"/>'+
  '<text x="80" y="108" text-anchor="middle" font-family="var(--font-display)" font-size="26" fill="var(--accent-ink)" opacity="0.9">W</text>'+
  '</svg>';
}

function renderToday(){
  var t=today(), e=todayEntry(S.uid), s=S.session;
  var due=dueCards(S.uid);
  var h="";

  h+='<div class="chips" style="margin-bottom:16px">';
  h+='<span class="chip'+(addedToday()>0?' on':'')+'">Added today <b>'+addedToday()+'</b></span>';
  h+='<span class="chip">Slips in the box <b>'+S.pool.length+'</b></span>';
  h+='<span class="chip'+(streakOf(S.uid)>0?' warn':'')+'">Streak <b>'+streakOf(S.uid)+'</b> days</span>';
  h+='<span class="chip'+(due.length?' warn':'')+'">Due for review <b>'+due.length+'</b></span>';
  h+='</div>';

  if(s && s.mode==="study"){ h+=studyPanel(s); }
  else if(s && (s.mode==="quiz"||s.mode==="review")){ h+=quizPanel(s); }
  else if(s && s.mode==="result"){ h+=resultPanel(s); }
  else if(!e){
    h+='<div class="panel"><div class="boxstage">'+boxSVG()+
      '<div><div class="eyebrow">'+esc(mdLabel(t))+' · today</div>'+
      '<h2>Draw five words, blind</h2>'+
      '<p class="dim" style="margin-bottom:14px;max-width:48ch">There are '+S.pool.length+' slips in the box right now. '+
      'You will get words your flatmates picked out of the books they are reading. No swapping once drawn.</p>'+
      (S.pool.length>=1
        ? '<button class="btn" id="btnDraw">Draw '+DRAW_N+' words</button>'
        : '<div class="empty" style="text-align:left">The box is still empty. Head to The Box and drop a few slips in first.</div>')+
      '</div></div></div>';
  }else{
    var cards=e.d.map(wordById).filter(Boolean);

function nextUpcoming(){
  var p=myProg(), best=null;
  Object.keys(p.cards).forEach(function(id){
    var c=p.cards[id], w=wordById(id);
    if(!w || typeof c.due!=="number") return;
    if(!best || c.due<best.c.due) best={c:c, w:w};
  });
  return best;
}

function posTag(w){ return w.pos ? '<span class="pos">'+esc(w.pos)+'</span> ' : ''; }

function slipHTML(w, masked, i){
  if(!w) return "";
  var rot = [-1.1, 0.7, -0.4, 1.2, -0.8][i%5];
  var h='<article class="slip deal'+(masked?' masked':'')+'" style="transform:rotate('+rot+'deg);animation-delay:'+(i*55)+'ms">';
  h+='<div class="w">'+(masked?"■■■■■":esc(w.word))+'</div>';
  h+='<div class="m">'+(masked?'<span class="tiny">sealed until you draw it</span>':(posTag(w)+esc(w.meaning)))+'</div>';
  if(!masked && w.example) h+='<div class="ex">“'+esc(w.example)+'”</div>';
  h+='<div class="src">'+(w.source?esc(w.source):'no source given')+
     '<span>·</span><span>'+esc(nameOf(w.by))+'</span></div>';
  h+='</article>';
  return h;
}

function quizPanel(s){
  var q=s.qs[s.i], w=q.word;
  var h='<div class="panel"><div class="panel-h"><h2>'+(s.mode==="review"?"Review quiz":"Today\'s quiz")+'</h2>'+
    '<span class="note">Question '+(s.i+1)+' of '+s.qs.length+' · '+s.correct+' right</span></div>';
  h+='<div class="q">';
  if(q.picked!==null){
    var used=(q.tookMs/1000);
    h+='<div class="qtimer"><div class="track"><div class="fill out" style="width:0%"></div></div>'+
       '<span class="sec">'+(q.picked===-1 ? "timed out" : (used<0.1?0.1:used).toFixed(1)+"s")+'</span></div>';
  }else{
    h+='<div class="qtimer"><div class="track"><div class="fill" id="qFill"></div></div>'+
       '<span class="sec" id="qSec">'+QUIZ_SEC+'s</span></div>';
  }
  h+='<div class="prompt">';
  if(q.kind==="en2zh"){
    h+='<div class="eyebrow">What does this word mean?</div><div class="big">'+esc(w.word)+'</div>';
  }else if(q.kind==="zh2en"){
    h+='<div class="eyebrow">Which word fits?</div><div class="big zh">'+posTag(w)+esc(w.meaning)+'</div>';
  }else{
    var re=new RegExp(String(w.word).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
    var sent=esc(w.example).replace(re,"____");
    h+='<div class="eyebrow">Fill in the blank</div><div class="cloze">'+sent.replace("____","<u></u>")+'</div>';
  }
  h+='</div><div class="opts">';
  var letters=["A","B","C","D"];
  q.opts.forEach(function(o,k){
    var cls="opt";
    if(q.picked!==null){
      if(k===q.ans) cls+=" right";
      else if(k===q.picked) cls+=" wrong";
    }
    h+='<button class="'+cls+'" data-opt="'+k+'"'+(q.picked!==null?" disabled":"")+'>'+
       '<span class="lt">'+letters[k]+'</span><span>'+esc(o)+'</span></button>';
  });
  h+='</div>';
  if(q.picked!==null){
    var ok=q.picked===q.ans;
    var head = ok ? "Correct" : (q.picked===-1 ? "Out of time (counts as wrong)" : "Not quite");
    h+='<div class="verdict '+(ok?"ok":"no")+'">'+head+' — '+
       posTag(w)+esc(w.word)+' - '+esc(w.meaning)+'</div>';
    h+='<button class="btn wide" id="qNext">'+(s.i+1<s.qs.length?"Next question":"See results")+'</button>';
  }else{
    h+='<div class="verdict"></div>';
  }
  h+='</div></div>';
  return h;
}

/* ---------- growth ---------- */
function growthSeries(days){
  var ids=memberIds();
  var dates=[];
  for(var i=days-1;i>=0;i--) dates.push(addDays(today(),-i));
  var series=ids.map(function(u){
    var p=progOf(u), last=0, vals=[];
    Object.keys(p.days).sort().forEach(function(k){
      if(k<dates[0] && typeof p.days[k].m==="number") last=p.days[k].m;
    });
    dates.forEach(function(d){
      if(p.days[d] && typeof p.days[d].m==="number") last=p.days[d].m;
      vals.push(last);
    });
    return {uid:u, vals:vals, color:seriesVar(u)};
  });
  return {dates:dates, series:series};
}

function drawGrowth(){
  var box=el("growthChart");
  if(!box) return;
  var W=Math.max(280, box.clientWidth || 640);
  var H=W<460?200:250;
  var g=growthSeries(W<460?10:14);
  var padL=34, padR=W<460?14:64, padT=14, padB=26;
  var maxV=0;
  g.series.forEach(function(s){ s.vals.forEach(function(v){ if(v>maxV) maxV=v; }); });
  var top=Math.max(4, Math.ceil((maxV+1)/4)*4);
  var iw=W-padL-padR, ih=H-padT-padB;
  var n=g.dates.length;
  function X(i){ return padL + (n<=1?iw/2:(i/(n-1))*iw); }
  function Y(v){ return padT + ih - (v/top)*ih; }

  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="growth curve of cumulative mastered words">';
  for(var t=0;t<=4;t++){
    var v=top*t/4, y=Y(v);
    svg+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+
         '" stroke="var(--line)" stroke-width="1"/>';
    svg+='<text x="'+(padL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10.5" '+
         'font-family="var(--font-mono)" fill="var(--muted)">'+Math.round(v)+'</text>';
  }
  var step=n>10?Math.ceil(n/5):2;
  for(var i=0;i<n;i+=step){
    svg+='<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" '+
         'font-family="var(--font-mono)" fill="var(--muted)">'+mdLabel(g.dates[i])+'</text>';
  }
  var endLabels=[];
  g.series.forEach(function(s){
    var d="";
    s.vals.forEach(function(v,i){ d += (i?" L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1); });
    var me=s.uid===S.uid;
    svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(me?2.6:2)+
         '" stroke-linecap="round" stroke-linejoin="round" opacity="'+(me?1:0.78)+'"/>';
    var lx=X(n-1), ly=Y(s.vals[n-1]);
    svg+='<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="'+(me?4.5:3.5)+
         '" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"/>';
    endLabels.push({y:ly, x:lx, me:me, text:nameOf(s.uid).slice(0,4)});
  });
  if(padR>40 && endLabels.length<=4){
    endLabels.sort(function(a,b){ return a.y-b.y; });
    var gap=14, lo=padT+6, hi=padT+ih-2;
    endLabels.forEach(function(L,i){
      var want=L.y;
      if(i>0) want=Math.max(want, endLabels[i-1].ly+gap);
      L.ly=Math.min(hi, Math.max(lo, want));
    });
    for(var q=endLabels.length-2;q>=0;q--){
      if(endLabels[q+1].ly-endLabels[q].ly<gap) endLabels[q].ly=endLabels[q+1].ly-gap;
    }
    endLabels.forEach(function(L){
      svg+='<text x="'+(L.x+9)+'" y="'+(L.ly+3.5).toFixed(1)+'" font-size="11" '+
           'font-family="var(--font-ui)" font-weight="'+(L.me?"600":"400")+'" '+
           'fill="var(--ink-2)">'+esc(L.text)+'</text>';
    });
  }
  svg+='<line x1="'+padL+'" y1="'+(padT+ih)+'" x2="'+(W-padR)+'" y2="'+(padT+ih)+
       '" stroke="var(--line-strong)" stroke-width="1"/>';
  svg+='<rect id="gHit" x="'+padL+'" y="'+padT+'" width="'+iw+'" height="'+ih+
       '" fill="transparent" style="cursor:crosshair"/>';
  svg+='<line id="gCross" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+ih)+
       '" stroke="var(--line-strong)" stroke-width="1" opacity="0"/>';
  svg+='</svg><div class="tip" id="gTip" hidden></div>';
  box.innerHTML=svg;

  var legend=el("growthLegend");
  if(legend){
    legend.innerHTML=g.series.map(function(s){
      return '<span class="lg"><i style="background:'+s.color+'"></i>'+
             esc(nameOf(s.uid))+(s.uid===S.uid?" (you)":"")+'</span>';
    }).join("");
  }

  var hit=box.querySelector("#gHit"), cross=box.querySelector("#gCross"), tip=el("gTip");
  if(!hit) return;
  function move(ev){
    var r=box.getBoundingClientRect();
    var scale=W/r.width;
    var cx=(ev.clientX-r.left)*scale;
    var i=Math.round((cx-padL)/(iw||1)*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i));
    cross.setAttribute("opacity","1");
    var html='<div class="d">'+esc(g.dates[i])+'</div>';
    g.series.forEach(function(s){
      html+='<div class="r"><span style="display:flex;align-items:center;gap:6px">'+
            '<i style="background:'+s.color+'"></i>'+esc(nameOf(s.uid))+'</span><b>'+s.vals[i]+'</b></div>';
    });
    tip.innerHTML=html;
    tip.hidden=false;
    var px=X(i)/scale;
    var tw=tip.offsetWidth||140;
    tip.style.left=Math.max(0,Math.min(r.width-tw, px-tw/2))+"px";
    tip.style.top="6px";
  }
  hit.addEventListener("mousemove",move);
  hit.addEventListener("touchstart",function(e){ move(e.touches[0]); },{passive:true});
  hit.addEventListener("touchmove",function(e){ move(e.touches[0]); },{passive:true});
  hit.addEventListener("mouseleave",function(){ cross.setAttribute("opacity","0"); tip.hidden=true; });
}

function renderGrowth(){
  var p=myProg();
  var cardIds=Object.keys(p.cards).filter(function(id){ return !!wordById(id); });
  var a=accuracyOf(p);
  var h='';

  h+='<div class="stats" style="margin-bottom:22px">'+
     '<div class="stat"><div class="k">Cards</div><div class="v">'+cardIds.length+'</div></div>'+
     '<div class="stat"><div class="k">Mastered</div><div class="v">'+masteredCount(p)+'</div></div>'+
     '<div class="stat"><div class="k">Accuracy</div><div class="v">'+(a.t?a.p:0)+'<small>%</small></div></div>'+
     '<div class="stat"><div class="k">Streak</div><div class="v">'+streakOf(S.uid)+'<small> days</small></div></div>'+
     '</div>';

  h+='<div class="panel"><div class="panel-h"><h2>Growth curve</h2>'+
     '<span class="note">cumulative mastered words (7-day interval or higher)</span></div>';
  var anyData=false;
  memberIds().forEach(function(u){ if(Object.keys(progOf(u).days).length) anyData=true; });
  if(!anyData){
    h+='<div class="empty">Finish a few days of quizzes and the curve will draw itself here.</div>';
  }else{
    h+='<div class="chartbox" id="growthChart"></div><div class="legend" id="growthLegend"></div>';
  }
  h+='</div>';

  /* stage distribution */
  var counts=[]; for(var b=0;b<=GRADUATED;b++) counts.push(0);
  cardIds.forEach(function(id){ counts[Math.min(GRADUATED, p.cards[id].b||0)]++; });
  var maxC=Math.max(1, Math.max.apply(null, counts));
  h+='<div class="panel" style="margin-top:22px"><div class="panel-h"><h2>Stage distribution</h2>'+
     '<span class="note">right moves up one, wrong drops two</span></div>';
  if(!cardIds.length){
    h+='<div class="empty">No cards yet. Go to Today and draw five words.</div>';
  }else{
    h+='<div class="boxbars">';
    counts.forEach(function(c,b){
      var isM=b>=MASTER_STAGE;
      h+='<div class="bb"><span class="lb">'+stageLabel(b)+' · '+stageInterval(b)+'</span>'+
         '<span class="tr"><span class="fl" style="width:'+Math.round(c/maxC*100)+'%;background:'+
         (isM?"var(--gold)":"var(--s1)")+'"></span></span>'+
         '<span class="n">'+c+'</span></div>';
    });
    h+='</div><p class="tiny" style="margin-top:10px">The higher the stage, the longer the gap before the word comes back - '+
       'that is how the schedule works against the forgetting curve.</p>';
  }
  h+='</div>';

  /* review schedule */
  var now=Date.now(), eod=endOfToday();
  var buckets=[
    {lb:"due", hi:now},
    {lb:"1 h", hi:now+HR},
    {lb:"today", hi:eod},
    {lb:"tomorrow", hi:eod+DAY},
    {lb:"3 days", hi:eod+3*DAY},
    {lb:"7 days", hi:eod+7*DAY},
    {lb:"later", hi:Infinity}
  ];
  buckets.forEach(function(b){ b.n=0; });
  cardIds.forEach(function(id){
    var d=p.cards[id].due;
    for(var i=0;i<buckets.length;i++){
      if(d<=buckets[i].hi){ buckets[i].n++; break; }
    }
  });
  var maxU=Math.max(1, buckets.reduce(function(m,x){return Math.max(m,x.n);},0));
  h+='<div class="panel" style="margin-top:22px"><div class="panel-h"><h2>Review schedule</h2>'+
     '<span class="note">when each word comes back</span></div><div class="duebars">';
  buckets.forEach(function(u){
    h+='<div class="db"><span class="vv">'+u.n+'</span>'+
       '<span class="bar'+(u.n?"":" zero")+'" style="height:'+Math.max(3,Math.round(u.n/maxU*64))+'px"></span>'+
       '<span class="lb">'+u.lb+'</span></div>';
  });
  h+='</div></div>';

  /* card log */
  h+='<div class="panel" style="margin-top:22px"><div class="panel-h"><h2>Card log</h2>'+
     '<span class="note">every card you have drawn</span></div>';
  if(!cardIds.length){
    h+='<div class="empty">You have not drawn any words yet.</div>';
  }else{
    var rows=cardIds.map(function(id){ return {id:id, c:p.cards[id], w:wordById(id)}; })
      .sort(function(x,y){ return x.c.due-y.c.due; });
    h+='<div class="tblwrap"><table><thead><tr>'+
       '<th>Word</th><th>POS</th><th>Meaning</th><th>Stage</th><th>Right</th><th>Next review</th></tr></thead><tbody>';
    rows.forEach(function(r){
      var b=Math.min(GRADUATED, r.c.b||0);
      h+='<tr><td class="wd">'+esc(r.w.word)+'</td><td class="num">'+esc(r.w.pos||"—")+'</td>'+
         '<td>'+esc(r.w.meaning)+'</td>'+
         '<td><span class="boxtag'+(b>=MASTER_STAGE?" m":"")+'">'+stageLabel(b)+'</span></td>'+
         '<td class="num">'+(r.c.c||0)+'/'+(r.c.s||0)+'</td>'+
         '<td class="num">'+esc(fmtRel(r.c.due))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  el("tab-growth").innerHTML=h;
  drawGrowth();
}

function bind(id, fn){ var e=el(id); if(e) e.onclick=fn; }

function setTab(t){
  S.tab=t;
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-tab")===t ? "true":"false");
  });
  ["today","box","rank","growth"].forEach(function(k){
    el("tab-"+k).hidden = (k!==t);
  });
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

var rendering=false;
function render(){
  if(rendering) return;
  rendering=true;
  try{
    renderWho();
    renderBanner();
    if(S.tab==="today") renderToday();
    else if(S.tab==="box") renderBox();
    else if(S.tab==="rank") renderRank();
    else renderGrowth();
  }finally{ rendering=false; }
}

 ["ephemeral","adj.","lasting a very short time","Fame in the digital age is often ephemeral.","Sapiens"],

 ["inevitable","adj.","certain to happen; unavoidable","Some friction is inevitable when a team doubles.","The Inevitable"]
];
var DEMO_PEOPLE=[
  {id:"demo_hin", name:"Alex", color:"#2a78d6"},
  {id:"demo_yau", name:"Priya", color:"#eb6834"},
  {id:"demo_ken", name:"Ken",  color:"#1baf7a"}
];

function seedDemo(){
  S.demo=true;
  S.uid="demo_hin";
  DEMO_PEOPLE.forEach(function(p){ S.profiles[p.id]={name:p.name,color:p.color,avatarUrl:""}; });

  DEMO_WORDS.forEach(function(w,i){
    S.pool.push({
      id:"dw"+i, word:w[0], pos:w[1], meaning:w[2], example:w[3], source:w[4],
      by:DEMO_PEOPLE[i%3].id, date:addDays(today(), -Math.floor(i/3)),
      at:new Date().toISOString()
    });
  });

  DEMO_PEOPLE.forEach(function(person, pi){
    var p=blankProg(person.id);
    var pace=[1.0,0.86,0.72][pi];
    var take=[18,15,13][pi];
    var high=[7,5,4][pi];              // number of mastered cards (7-day interval or higher)
    var now=Date.now();
    for(var i=0;i<take;i++){
      var b = i<high ? (MASTER_STAGE + (i%3)) : (i-high)%MASTER_STAGE;
      b=Math.min(GRADUATED,b);
      var offs=[ -3*MIN, 20*MIN, 4*HR, 9*HR, 1.4*DAY, 2.6*DAY, 5*DAY, 9*DAY ];
      p.cards["dw"+i]={
        b:b,
        due: now + offs[i%offs.length],
        s:2+(i%4), c:1+(i%3), w:(i%2)
      };
    }
    var M=masteredCount(p);
    var pts=0;
    for(var k=13;k>=1;k--){
      var d=addDays(today(),-k);
      var ids=[];
      for(var j=0;j<DRAW_N;j++){ ids.push("dw"+((pi*7+(13-k)*5+j)%DEMO_WORDS.length)); }
      var qc=Math.min(5, Math.max(2, Math.round((3+((k*7+pi*3)%3))*pace)));
      pts += qc*PTS.correct + (qc===5?PTS.perfect:0) + 2*PTS.word;
      p.days[d]={d:ids, st:1, qc:qc, qt:5, m:Math.round(M*(14-k)/13), p:0};
    }
    p.pts=pts;
    S.prog[person.id]=p;
  });
  render();
}

/* ===================== sign-in gate ===================== */
function gateEl(){
  var g=el("gate");
  if(!g){
    g=document.createElement("div");
    g.id="gate";
    document.body.appendChild(g);
  }
  return g;
}
function showApp(on){
  document.querySelector("header.top").hidden = !on;
  el("appwrap").hidden = !on;
  var g=el("gate");
  if(g) g.hidden = on;
}
function renderGate(state, detail){
  var g=gateEl();
  g.hidden=false;
  var h='<div class="gatecard">';
  h+='<div class="gatemark">Word Box</div>';
  if(state==="signin"){
    h+='<h1>The daily five-word challenge</h1>'+
       '<p>Sign in with your Gmail and you get your own cards, your own review schedule and your own spot on the leaderboard.</p>'+
       '<button class="btn" id="btnIn">Sign in with Google</button>';
    if(detail) h+='<p class="err">'+esc(detail)+'</p>';
  }else if(state==="denied"){
    h+='<h1>This box is invite-only</h1>'+
       '<p><b>'+esc(detail||"")+'</b> is not on the list. Ask the owner to add your Gmail under Leaderboard &rarr; Members and you are in straight away.</p>'+
       '<button class="btn ghost" id="btnOut2">Use a different account</button>';
  }else if(state==="notready"){
    h+='<h1>The box is not open yet</h1>'+
       '<p>The owner has not signed in, so the member list does not exist yet. Ask them to open this page once as <b>'+esc(OWNER_EMAIL)+'</b>.</p>'+
       '<button class="btn ghost" id="btnOut2">Use a different account</button>';
  }else{
    h+='<h1>Connecting</h1><p>Opening the box.</p>';
  }
  h+='</div>';
  g.innerHTML=h;
  showApp(false);
  bind("btnIn", doSignIn);
  bind("btnOut2", function(){ signOut(FB.auth); });
}
function doSignIn(){
  var provider=new GoogleAuthProvider();
  provider.setCustomParameters({prompt:"select_account"});
  signInWithPopup(FB.auth, provider).catch(function(e){
    var msg = e && e.code==="auth/popup-blocked"
      ? "Your browser blocked the sign-in window. Allow pop-ups and try again."
      : (e && e.code==="auth/unauthorized-domain"
        ? "This domain is not in the Firebase Authorized domains list."
        : "Sign-in failed: "+(e && e.code ? e.code : "unknown"));
    renderGate("signin", msg);
  });
}

/* ===================== boot ===================== */
var unsubs=[];
function listen(){
  unsubs.forEach(function(u){ try{u();}catch(e){} });
  unsubs=[];
  unsubs.push(onSnapshot(
    query(collection(FB.db,"pool"), orderBy("at","desc"), limit(500)),
    function(snap){
      var arr=[];
      snap.forEach(function(d){
        var v=d.data()||{};
        arr.push({id:d.id, word:v.word, pos:v.pos, meaning:v.meaning, example:v.example,
                  source:v.source, by:v.by, at:v.at, date:v.date});
      });
      S.pool=arr;
      render();
    },
    function(e){ flash("Could not read the word box: "+(e&&e.code?e.code:"unknown")); render(); }
  ));
  unsubs.push(onSnapshot(doc(FB.db,"config","roster"), function(snap){
    var d=snap.exists() ? (snap.data()||{}) : {};
    ROSTER={emails:d.emails||[], open:d.open===true};
    if(FB.me && !inRoster(FB.me.email)){ renderGate("denied", FB.me.email||""); return; }
    render();
  }, function(){}));
  unsubs.push(onSnapshot(collection(FB.db,"progress"), function(snap){
    var next={}, profs={};
    snap.forEach(function(d){
      var v=d.data()||{};
      next[d.id]={uid:d.id, pts:v.pts||0, cards:v.cards||{}, days:v.days||{}};
      profs[d.id]={name:v.name||"", color:colorFor(d.id), avatarUrl:v.photo||""};
    });
    S.prog=next;
    Object.keys(profs).forEach(function(k){ S.profiles[k]=profs[k]; });
    render();
  }, function(e){ flash("Could not read the leaderboard: "+(e&&e.code?e.code:"unknown")); render(); }));
}

function colorFor(uid){
  var pal=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
  var n=0;
  for(var i=0;i<uid.length;i++) n=(n*31+uid.charCodeAt(i))>>>0;
  return pal[n%pal.length];
}

if(!CONFIGURED){
  seedDemo();
  showApp(true);
}else{
  renderGate("loading");
  FB.app = initializeApp(FIREBASE_CONFIG);
  FB.auth = getAuth(FB.app);
  FB.db = getFirestore(FB.app);
  onAuthStateChanged(FB.auth, function(u){
    if(!u){
      FB.me=null; S.uid=null; IS_OWNER=false;
      unsubs.forEach(function(f){try{f();}catch(e){}}); unsubs=[];
      renderGate("signin");
      return;
    }
    IS_OWNER = lc(u.email)===lc(OWNER_EMAIL);
    renderGate("loading");
    var halted=false;
    getDoc(doc(FB.db,"config","roster")).then(function(snap){
      if(!snap.exists()){
        if(!IS_OWNER){ halted=true; renderGate("notready", u.email||""); return null; }
        // owner's first visit: create the roster
        ROSTER={emails:[lc(OWNER_EMAIL)], open:false};
        return setDoc(doc(FB.db,"config","roster"), ROSTER);
      }
      var d=snap.data()||{};
      ROSTER={emails:d.emails||[], open:d.open===true};
      return null;
    }).then(function(){
      if(halted) return;
      if(!inRoster(u.email)){ renderGate("denied", u.email||""); return; }
      FB.me=u;
      S.demo=false;
      S.uid=u.uid;
      S.pool=[]; S.prog={};
      S.profiles[u.uid]={name:u.displayName||"You", color:colorFor(u.uid), avatarUrl:u.photoURL||""};
      showApp(true);
      render();
      listen();
    }).catch(function(e){
      renderGate("signin", "Could not read the member list: "+(e && e.code ? e.code : "unknown")+". Check that your Firestore rules were pasted correctly.");
    });
  });
}
